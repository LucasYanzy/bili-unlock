name: 问题反馈 / Bug report
description: 解锁失败、播放问题、界面异常
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: 视频页面地址
      placeholder: https://www.bilibili.com/bangumi/play/ep...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器和脚本管理器
      options:
        - Safari + Userscripts
        - Chrome + Tampermonkey
        - Edge + Tampermonkey
        - Firefox + Tampermonkey / Violentmonkey
        - 其他
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: 你所在的国家/地区
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 面板上显示的错误信息请原样贴上（脚本已自动隐藏令牌，请勿贴出 access_key / Cookie）
    validations:
      required: true
